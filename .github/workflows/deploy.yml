# Despliega a Vercel en cada push (de cualquier colaborador).
# - Push a la rama de producción  -> deploy de producción (apolomediasites.vercel.app)
# - Push a cualquier otra rama    -> deploy de preview (URL temporal en el log del job)
#
# Requiere el secreto VERCEL_TOKEN en Settings > Secrets and variables > Actions.
name: Deploy to Vercel

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_E0kdHjs9mAfhlFyYbg5Pm5Qw
  VERCEL_PROJECT_ID: prj_gLx4ghqUrQbxrlGOHiCsVERxlrUF
  PRODUCTION_BRANCH: claude/apollo-landing-page-ellde5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Decide environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "${PRODUCTION_BRANCH}" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          URL=$(vercel deploy --yes ${{ steps.env.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "Desplegado en: $URL"
          echo "### Deploy (${{ steps.env.outputs.target }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
